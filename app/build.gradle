import com.android.build.api.artifact.SingleArtifact
import groovy.json.JsonOutput

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

def releaseVersion = '1.2.20'
def releaseNotesFile = layout.projectDirectory.file("release-notes/${releaseVersion}.txt")
def releaseNotes = providers.fileContents(releaseNotesFile).asText.map { notes -> notes.trim() }.orElse("")

def streamTimeout = { String name, int fallback ->
    def value = providers.gradleProperty(name).getOrElse(fallback.toString())
    if (!value.isInteger() || value.toInteger() <= 0) {
        throw new GradleException("${name} must be a positive integer in milliseconds")
    }
    value.toInteger().toString()
}

android {
    namespace = 'cn.hdfk7.android.iptv'
    compileSdk {
        version = release(37)
    }
    signingConfigs {
        debug {
            keyAlias = APK_SIGN_KEY_PASSWORD_DEBUG_ALIAS
            keyPassword = APK_SIGN_KEY_PASSWORD_DEBUG
            storeFile = file(APK_SIGN_STORE_PATH)
            storePassword = APK_SIGN_STORE_PASSWORD
        }
        prod {
            keyAlias = APK_SIGN_KEY_PASSWORD_PROD_ALIAS
            keyPassword = APK_SIGN_KEY_PASSWORD_PROD
            storeFile = file(APK_SIGN_STORE_PATH)
            storePassword = APK_SIGN_STORE_PASSWORD
        }
    }
    defaultConfig {
        applicationId = 'cn.hdfk7.android.iptv'
        minSdk = 26
        targetSdk = 34
        versionCode = 24
        versionName = releaseVersion
        def updateManifestUrl = providers.gradleProperty("APP_UPDATE_MANIFEST_URL").getOrElse("")
        buildConfigField "String", "APP_UPDATE_MANIFEST_URL", JsonOutput.toJson(updateManifestUrl)
        buildConfigField "String", "APP_RELEASE_NOTES", JsonOutput.toJson(releaseNotes.get())
        buildConfigField "boolean", "APP_DEBUG_SWITCH", APP_DEBUG_SWITCH
        buildConfigField "int", "STREAM_CONNECT_TIMEOUT_MS", streamTimeout("STREAM_CONNECT_TIMEOUT_MS", 5000)
        buildConfigField "int", "STREAM_READ_TIMEOUT_MS", streamTimeout("STREAM_READ_TIMEOUT_MS", 5000)
        buildConfigField "int", "STREAM_PROBE_TIMEOUT_MS", streamTimeout("STREAM_PROBE_TIMEOUT_MS", 8000)
    }
    buildFeatures {
        resValues = true
        buildConfig = true
        compose = true
    }
    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            signingConfig = signingConfigs.debug
            resValue "string", "app_display_name", APP_DISPLAY_NAME
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            optimization {
                enable = false
            }
            signingConfig = signingConfigs.prod
            resValue "string", "app_display_name", APP_DISPLAY_NAME
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST']
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def date = new Date().format('yyyyMMddHHmmss')
            output.outputFileName.set("${APP_DISPLAY_NAME}-${variant.buildType}-v${output.versionName.get()}-${date}.apk")
        }
        def variantName = variant.name.capitalize()
        def apkDirectory = variant.artifacts.get(SingleArtifact.APK.INSTANCE)
        def loader = variant.artifacts.getBuiltArtifactsLoader()
        def manifestFile = layout.buildDirectory.file("outputs/update/${variant.name}/latest.json")
        def manifestTask = tasks.register("generate${variantName}UpdateManifest") {
            inputs.dir(apkDirectory)
            inputs.property("releaseNotes", releaseNotes)
            outputs.file(manifestFile)
            doLast {
                def artifacts = loader.load(apkDirectory.get())
                if (artifacts == null || artifacts.elements.size() != 1) {
                    throw new GradleException("Expected one APK for the update manifest")
                }
                def apk = artifacts.elements.first()
                def target = manifestFile.get().asFile
                target.parentFile.mkdirs()
                def manifest = [
                    versionCode: apk.versionCode,
                    versionName: apk.versionName,
                    apkUrl: new File(apk.outputFile).name
                ]
                def notes = releaseNotes.get()
                if (!notes.isEmpty()) {
                    manifest.releaseNotes = notes
                }
                target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator(), "UTF-8")
            }
        }
        tasks.matching { it.name == "assemble${variantName}" }.configureEach {
            dependsOn(manifestTask)
        }
    }
}

